[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xml2cf"
version = "0.2.0"
description = "Compile 1C Designer XML dumps into .cf without the 1C platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crabopal" }]
dependencies = [
  "v8unpack>=1.2.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
xml2cf = "xml2cf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xml2cf = ["data/*", "data/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
